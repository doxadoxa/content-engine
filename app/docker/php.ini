; The FrankenPHP base image ships no php.ini, so PHP falls back to defaults that
; are tighter than a pipeline engine wants.

; Brief attachments and inline images go through the panel's file uploads.
upload_max_filesize = 64M
post_max_size = 64M

; Pipeline runs decode large JSON payloads (keyword pulls, corpus indexes).
memory_limit = 512M

; Generation steps legitimately run for minutes. Queue workers get their own
; timeout from the worker config; this covers the CLI and the web process.
max_execution_time = 0
max_input_time = 300

; Container logs are the log.
log_errors = On
error_log = /dev/stderr

; OPcache: real gains in the web container, harmless in the workers.
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 192
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 1
opcache.revalidate_freq = 2
