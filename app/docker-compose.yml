# content-engine — the whole local stack.
#
#   cp .env.example .env           # then fill in your API keys
#   docker compose up --build      # app + horizon + scheduler + datastores
#
#   http://localhost:8091          the operator dashboard (sign in at /login)
#   http://localhost:8091/horizon  queue dashboard
#   http://localhost:8026          every mail this stack sends
#
# app / horizon / scheduler are the SAME image differing only by CONTAINER_MODE,
# which is how it runs in production too.
#
# Host ports are shifted off the defaults so this can run alongside other local
# stacks. Override them with the CE_*_PORT variables in your .env.

name: content-engine

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    image: content-engine:dev
    # Comes back on its own, like the datastores below.
    #
    # This used to be set on postgres and redis alone, and the asymmetry was not
    # a small one: when Docker's daemon died on 19 August 2026 the data services
    # came back and nothing that serves or works did. `docker compose ps` showed
    # a stack that was half up, port 8091 was still held open by the daemon's
    # port-forwarder so requests hung rather than being refused, and the tunnel
    # in front of it looked like the thing that was broken.
    #
    # `unless-stopped` rather than `always`, so `docker compose stop` still
    # means stopped. That is the difference between a policy that survives a
    # crash and one that argues with you.
    restart: unless-stopped
    # Everything from your .env reaches the container, so a key you add there
    # just works. The `environment` block below still wins where it is set,
    # which is how the host-facing values in .env (DB_HOST=127.0.0.1 and
    # friends) get replaced by the compose network's own addresses.
    env_file: &app-env-file
      - path: .env
        required: false
    environment: &app-env
      CONTAINER_MODE: app
      APP_ENV: "${APP_ENV:-local}"
      # Overridable, because `environment:` wins over `env_file:` and these are
      # the pair you change to put the app behind a tunnel. Hardcoded, they
      # silently ignore .env: APP_DEBUG stays on with a public hostname pointed
      # at it, which serves a stack trace containing every key in the
      # environment to whoever triggers an error.
      APP_DEBUG: "${APP_DEBUG:-true}"
      APP_URL: "${APP_URL:-http://localhost:${CE_APP_PORT:-8091}}"
      # Local-only key, shared by every container. Not a production secret.
      APP_KEY: base64:qO3H1n8cJt5vX2bK9wR4dM7gY0sT6uA1eL5pN8iZ3Fc=
      # A stack, not plain stderr: `docker logs` still shows everything, and
      # `Log::error` additionally reaches Sentry. Set here as well as in the
      # Dockerfile because this block wins over both it and .env — changing
      # only one of the two leaves the containers on the old value.
      LOG_CHANNEL: stack
      LOG_STACK: stderr,sentry

      # Inside the compose network. Absent in production until the service is
      # deployed there, and PanelRenderer treats absent as "not configured"
      # rather than as an error.
      RENDERER_URL: "${RENDERER_URL:-http://renderer:3020}"

      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: content_engine
      DB_USERNAME: content_engine
      DB_PASSWORD: secret
      # The suite runs against content_engine_test, created by
      # docker/postgres/init and pinned in phpunit.xml, so `php artisan test`
      # never touches the database above.

      # predis rather than the phpredis C extension, so the image needs no
      # extra build step for Redis.
      REDIS_CLIENT: predis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
      SESSION_DRIVER: redis
      BROADCAST_CONNECTION: log

      # Mail goes to Mailpit and no further. Set here rather than left to .env
      # because `environment:` wins over `env_file:`, which is what makes this
      # a guarantee: a real RESEND_API_KEY in your .env cannot send from this
      # stack even if MAIL_MAILER there says `resend`. Development runs on
      # invented addresses, and some of them belong to real people.
      MAIL_MAILER: smtp
      MAIL_SCHEME: smtp
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
      # Pinned too, and this one is the whole guarantee rather than a detail.
      # A single MAIL_URL overrides host, port, username and password at once
      # (`MailManager::getConfig` merges the parsed URL over the config), so a
      # `.env` carrying MAIL_URL=smtps://resend:re_live_...@smtp.resend.com
      # would reach a container through `env_file:` and send real mail past
      # every other line here. It is set to Mailpit's own URL rather than
      # blanked: `isset('')` is true, and the parser would then leave the
      # transport null and break mail entirely.
      MAIL_URL: "smtp://mailpit:1025"
      # Mailpit accepts anything. Blanked so credentials left in .env for a
      # real provider do not make the container try to authenticate against a
      # server that never asked.
      MAIL_USERNAME: ""
      MAIL_PASSWORD: ""

      # Seeded on boot so the stack is immediately usable. Change these in your
      # .env; they are local-only credentials.
      SEED_ADMIN_EMAIL: "${SEED_ADMIN_EMAIL:-admin@content-engine.test}"
      SEED_ADMIN_NAME: "${SEED_ADMIN_NAME:-Operator}"
      SEED_ADMIN_PASSWORD: "${SEED_ADMIN_PASSWORD:-password}"
    ports:
      - "127.0.0.1:${CE_APP_PORT:-8091}:80"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      # Named here and not only in `compose up`, because `compose up app`
      # starts exactly what is listed. Without this the SMTP host does not
      # exist in the network and the mail a flow depends on fails to send —
      # which is a queued job retrying against nothing, and a verification
      # link that never arrives.
      #
      # `service_started` and not `service_healthy`: healthy would make a
      # development mail viewer a boot blocker for the whole stack, so an
      # image that will not pull takes the engine down with it. Laravel opens
      # the SMTP connection at send time and the notification carrying it is
      # queued and retried, so being merely started is enough.
      mailpit:
        condition: service_started
    volumes: &app-volumes
      # The checkout, mounted over the image's copy of it. Without this the code
      # is whatever `COPY . .` baked in at build time, so every change needs a
      # rebuild before it is running anywhere.
      #
      # Local only, and this file is the local stack: it builds `target: dev`
      # and hardcodes a throwaway APP_KEY. Anything deploying this app builds
      # the `production` target, which has no mount and carries its own code.
      - .:/app
      # Kept out of the mount — nothing at runtime reads node_modules, and a
      # directory that size is what makes a macOS bind mount crawl.
      - /app/node_modules
      # Shared so every container sees the same APP_KEY file. Nested inside the
      # bind above, and the longer path wins.
      - storage:/app/storage
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost/up"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

  # Draws the panels a teaching carousel is made of, and the seam video will
  # arrive through. Not published to the host: it is an unauthenticated browser
  # that renders whatever HTML it is handed, and it is safe only because nothing
  # outside this network can reach it.
  renderer:
    build:
      # The app root, so the image can take the brand's typeface from
      # resources/fonts rather than keeping a second copy of it.
      context: .
      dockerfile: docker/renderer/Dockerfile
    image: content-engine-renderer:dev
    restart: unless-stopped
    environment:
      RENDERER_PORT: 3020
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3020/up').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 12
      # Bundling happens once at boot and takes a while on a cold image.
      start_period: 120s

  # Every mail the stack sends, held and displayed instead of delivered.
  #
  # Registration and password reset are the flows this exists for: both are
  # behind a link that only arrives by mail, and before this the link only
  # existed in `docker compose logs`. A flow you can only verify by reading
  # stderr is one nobody verifies.
  #
  # The SMTP port stays inside the compose network. Only the web UI is
  # published, and only to 127.0.0.1 — this is an open relay that shows
  # everything it receives to anyone who asks.
  mailpit:
    image: axllent/mailpit:v1.31
    restart: unless-stopped
    environment:
      # Messages live in the container and go when it does. A mailbox that
      # survives `compose down` would mostly serve to confuse the next test
      # with last week's verification links.
      MP_SMTP_BIND_ADDR: 0.0.0.0:1025
      MP_UI_BIND_ADDR: 0.0.0.0:8025
      MP_MAX_MESSAGES: 500
    ports:
      - "127.0.0.1:${CE_MAIL_PORT:-8026}:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

  horizon:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    image: content-engine:dev
    # `depends_on` orders `compose up` and nothing else — the daemon bringing
    # containers back after a reboot does not re-evaluate it. So this may well
    # start before the app is healthy, fail to reach postgres, and exit. That is
    # what the restart policy is for: it retries, with the daemon's own backoff,
    # until the database is there. A worker that gives up once is the whole
    # reason this line exists.
    restart: unless-stopped
    env_file: *app-env-file
    environment:
      <<: *app-env
      CONTAINER_MODE: horizon
    depends_on:
      app:
        condition: service_healthy
    volumes: *app-volumes
    # The FrankenPHP base image healthchecks Caddy's admin endpoint, which a
    # worker container does not run. Ask Horizon itself instead.
    healthcheck:
      test: ["CMD", "php", "artisan", "horizon:status"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 60s

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    image: content-engine:dev
    # The one this matters most for, because nothing downstream complains when
    # it is gone. This container exited 1 around 14 August 2026 and stayed
    # exited: `engine:tick` stopped firing, and with it every hourly and daily
    # entry in routes/console.php. Five days of no research, no drafting, no
    # publishing and no visibility sweep, on a stack whose dashboard was up the
    # whole time — the article backlog was the first anyone knew of it.
    restart: unless-stopped
    env_file: *app-env-file
    environment:
      <<: *app-env
      CONTAINER_MODE: scheduler
    depends_on:
      app:
        condition: service_healthy
    volumes: *app-volumes
    # Nothing to probe — `schedule:work` sleeps between minutes and serves no
    # port. Disable the base image's check rather than report a permanently
    # unhealthy container.
    healthcheck:
      disable: true

  postgres:
    # pgvector's image rather than postgres:17-alpine, which ships no `vector`
    # extension — the enable-extension migration would fail on a clean volume
    # and the stack would only work for whoever installed it by hand.
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_DB: content_engine
      POSTGRES_USER: content_engine
      POSTGRES_PASSWORD: secret
    ports:
      # For external DB tools only; the app connects over the compose network.
      - "127.0.0.1:${CE_DB_PORT:-5437}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Runs once, on an empty volume: creates the suite's database and enables
      # pgvector in both.
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U content_engine"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:${CE_REDIS_PORT:-6384}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  storage:
  pgdata:
