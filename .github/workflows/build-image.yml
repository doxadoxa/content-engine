name: Build & Push Images

# Builds and pushes the two production container images on every push to main:
#
#   ghcr.io/<owner>/<repo>            the multi-mode app image (app/horizon/
#                                     queue/scheduler, chosen by CONTAINER_MODE)
#   ghcr.io/<owner>/<repo>/renderer   the Remotion renderer (Node + Chromium)
#
# PRs do NOT build images — tests.yml validates them; the images are built only
# once a change lands on main, to save CI compute. Deploy by pulling the
# `sha-<commit>` tag, which is the same string the app reports to Sentry as its
# release.
#
# Everything the build needs lives under `app/`, so that is the build context
# for both images and `app/.dockerignore` is the one that applies.

on:
  push:
    branches: [main]
  # For rebuilding a tag by hand while preparing a deployment.
  workflow_dispatch:

# One build per commit on main; never cancel an in-flight deploy build.
concurrency:
  group: build-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  app:
    name: Build app image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,prefix=sha-
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./app
          file: ./app/Dockerfile
          target: production
          # The runner is amd64 and so is the deployment. Named rather than left
          # implicit because adding linux/arm64 here would emulate the whole PHP
          # and Node build under QEMU, which is hours, not minutes.
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Vite inlines VITE_* literally, so the browser DSN and the release have
          # to be present at build time — setting them on the running container
          # does nothing. All optional: with none of them configured the image
          # builds unchanged and simply reports nothing to Sentry.
          #
          # Configure as repository variables: SENTRY_ORG, SENTRY_PROJECT,
          # VITE_SENTRY_ENVIRONMENT, VITE_SENTRY_TRACES_SAMPLE_RATE.
          # Configure as repository secrets: VITE_SENTRY_DSN, SENTRY_AUTH_TOKEN.
          #
          # SENTRY_RELEASE is the commit sha, which is also the image tag and what
          # the server reports under — the three must agree or Sentry holds source
          # maps it will never apply.
          build-args: |
            SENTRY_RELEASE=${{ github.sha }}
            VITE_SENTRY_DSN=${{ secrets.VITE_SENTRY_DSN }}
            VITE_SENTRY_ENVIRONMENT=${{ vars.VITE_SENTRY_ENVIRONMENT || 'production' }}
            VITE_SENTRY_TRACES_SAMPLE_RATE=${{ vars.VITE_SENTRY_TRACES_SAMPLE_RATE }}
            SENTRY_ORG=${{ vars.SENTRY_ORG }}
            SENTRY_PROJECT=${{ vars.SENTRY_PROJECT }}
          # A secret and not a build arg: an ARG is readable in the image history
          # of anyone who can pull the intermediate stage. Unset, vite.config.ts
          # emits no source maps and skips the upload.
          secrets: |
            sentry_auth_token=${{ secrets.SENTRY_AUTH_TOKEN }}
          cache-from: type=gha,scope=app
          cache-to: type=gha,mode=max,scope=app

  renderer:
    name: Build renderer image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/renderer
          tags: |
            type=sha,prefix=sha-
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          # Context is `app/`, not `app/docker/renderer/`: the Dockerfile copies
          # `resources/fonts` from the application so the panels are drawn with
          # the same WOFF2 files the site already ships.
          context: ./app
          file: ./app/docker/renderer/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Its own cache scope. Sharing one with the app image would have each
          # build evict the other's layers, and this one carries a ~150MB
          # Chromium download that is expensive to lose.
          cache-from: type=gha,scope=renderer
          cache-to: type=gha,mode=max,scope=renderer
